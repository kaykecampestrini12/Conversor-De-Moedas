<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevClub - Convert Money</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <div class="header">CodeClub Convert Money</div>

    <main>

      <label>
        Converter <b>de</b>
        <select>
          <option>R$ Real Brasileiro</option>
        </select>
      </label>

      <label>
        Converter <b>para</b>
        <select class="currency-select">
          <option value="Dolar">US$ Dólar Americano</option>
          <option value="Euro">R$ Euro</option>
          <option value="BitCoin">฿ BitCoin</option>
        </select>
      </label>

      <label>
        Valor
        <input
          type="number"
          class="input-currency"
          placeholder="R$ 10.000,00"
        />
      </label>

      <button class="convert-button">Converter</button>

      <section>
        <div class="currency-box">
          <img
            class="brasil-logo"
            src="./assets/brasil-logo.png"
            alt="Logo do Brasil"
          />
          <p class="currency">Real</p>
          <p class="currency-value-to-convert">R$0.00</p>
        </div>

        <img class="arrow-img" src="./assets/seta.png" alt="" />

        <div class="currency-box">
          <img class="us-logo" src="./assets/dolar.png" alt="Logo do Eua" />
          <p class="currency" id="currencyName">Dólar</p>
          <p class="currency-value">US$0.00</p>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
